<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のイラストのポートフォリオ</title>
  <link rel="stylesheet" href="irasuto.css">
</head>
<body>

  <!-- 手動のボタンは消して、id="quickMenu" を追加！ -->
  <div class="quick-menu" id="quickMenu"></div>

  <h1>✨私のイラストギャラリー✨</h1>
  <p>自分のイラストを載せるページ</p>

  <!-- 1枚目の作品 -->
  <div class="gallery-item" style="margin-bottom: 40px !important;">
    <img src="https://cdn.ibispaint.com/movie/403/16/403016888/image403016888d.png" alt="思い出" class="gallery-img" style="max-width: 600px;">
    <details>
      <summary>作品の説明を見る</summary>
      <p>制作日：2026年 / 使用ソフト：アイビスペイント</p>
      <p>ギャルのお題で描いたやつ</p>
    </details>
  </div>

  <!-- 2枚目の作品 -->
  <div class="gallery-item" style="margin-bottom: 40px !important;">
    <img src="https://cdn.ibispaint.com/movie/989/57/989057999/image989057999d.png" alt="病" class="gallery-img">
    <details>
      <summary>作品の説明を見る</summary>
      <p>制作日：２０２６年/使用ソフト：アイビスペイント</p>
      <p>天使描きたかった</p>
    </details>
  </div>

<script>
  // --- パスワード認証ブロック ---
  const correctPassword = "mike"; // ここを好きなパスワードに変えてね！
  const input = prompt("パスワードを入れるんじゃ");

  if (input !== correctPassword) {
    alert("あなたは３日以内に骨が溶けて死にます🦴");
    // パスワードが違う場合は白紙にするか、別のページに飛ばすなど
    document.body.innerHTML = "<h1>🚫知り合い以外立ち入り禁止🚫</h1><p>正しいパスワードを入力して再読み込みしてください。</p>";
    throw new Error("Unauthorized"); // 以降の処理をストップ
  }
  
  const items = document.querySelectorAll('.gallery-item');
  const menu = document.getElementById('quickMenu');

  // 1. モーダル要素の作成
  const modal = document.createElement('div');
  modal.className = 'image-popup-modal';
  modal.innerHTML = '<span class="image-popup-close">&times;</span><img src="" alt="拡大画像">';
  document.body.appendChild(modal);

  const modalImg = modal.querySelector('img');
  const closeBtn = modal.querySelector('.image-popup-close');

  function closeModal() {
    modal.style.display = 'none';
  }
  
  // 閉じるボタンと背景クリックで閉じるように設定
  if (closeBtn) {
    closeBtn.onclick = closeModal;
  }
  modal.onclick = (e) => {
    // 画像そのものをクリックした時は閉じないようにする配慮（任意ですが、モーダル背景クリック時のみ閉じる場合）
    if (e.target === modal) {
      closeModal();
    }
  };

  items.forEach((item, index) => {
    const num = index + 1;
    
    // ① 自動で目印（id）を振る
    item.id = 'illst' + num;
    
    // ② 自動で右側の目次ボタンを作る
    const a = document.createElement('a');
    a.href = '#illst' + num;
    a.textContent = num + '枚目';
    menu.appendChild(a);

    // ③ 画像をクリックしたら新しいタブで原寸大を開く！ (またはモーダルで拡大する場合)
    const img = item.querySelector('.gallery-img');
    if (img) {
      img.style.cursor = 'pointer';
      img.onclick = function() {
        // 新しいタブで開く元の挙動にする場合：
        window.open(img.src, '_blank');
        
        // ※もしモーダルで拡大表示させたい場合はこっち（コメントアウト解除）
        // modalImg.src = img.src;
        // modal.style.display = 'block';
      };
    }
  });
</script>
</body>
</html>
